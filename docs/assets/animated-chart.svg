<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320">
  <defs>
    <linearGradient id="chartCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .chart-curve {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: animatePath 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite alternate;
      }
      .bar-grow {
        transform-origin: bottom;
        animation: pulseBar 3s ease-in-out infinite alternate;
      }
      .point-pulse {
        animation: pulsePoint 2s ease-in-out infinite;
      }
      .live-dot {
        animation: liveBlink 1.5s infinite;
      }

      @keyframes animatePath {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseBar {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1); }
      }
      @keyframes pulsePoint {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="310" rx="14" fill="url(#chartCardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Card Header -->
  <g transform="translate(30, 35)">
    <circle cx="8" cy="8" r="4" fill="#10b981" class="live-dot" />
    <text x="20" y="12" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
      Atmospheric Telemetry &amp; 5-Day Forecast Matrix
    </text>
    <text x="560" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Dual-Axis • 3-Hour Resolution
    </text>
  </g>

  <!-- Legend & Badges -->
  <g transform="translate(30, 65)">
    <!-- Temp Legend -->
    <line x1="0" y1="6" x2="16" y2="6" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="8" cy="6" r="3" fill="#38bdf8" />
    <text x="24" y="10" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Temperature (°C)</text>

    <!-- Precip Legend -->
    <rect x="160" y="0" width="12" height="12" rx="3" fill="url(#barGradient)" />
    <text x="180" y="10" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Precipitation Chance (%)</text>

    <!-- Range Pill -->
    <rect x="680" y="-8" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="730" y="9" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">LIVE STREAM</text>
  </g>

  <!-- Coordinate Grid & Axes -->
  <g transform="translate(60, 95)" opacity="0.2" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="0" x2="720" y2="0" />
    <line x1="0" y1="40" x2="720" y2="40" />
    <line x1="0" y1="80" x2="720" y2="80" />
    <line x1="0" y1="120" x2="720" y2="120" />
    <line x1="0" y1="160" x2="720" y2="160" />

    <line x1="0" y1="0" x2="0" y2="160" stroke-dasharray="0" />
    <line x1="120" y1="0" x2="120" y2="160" />
    <line x1="240" y1="0" x2="240" y2="160" />
    <line x1="360" y1="0" x2="360" y2="160" />
    <line x1="480" y1="0" x2="480" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="720" y1="0" x2="720" y2="160" stroke-dasharray="0" />
  </g>

  <!-- Y-Axis Labels (Left: Temp) -->
  <g transform="translate(50, 95)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">
    <text x="0" y="5">25°</text>
    <text x="0" y="45">20°</text>
    <text x="0" y="85">15°</text>
    <text x="0" y="125">10°</text>
    <text x="0" y="165">5°</text>
  </g>

  <!-- Y-Axis Labels (Right: Precip) -->
  <g transform="translate(790, 95)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="start">
    <text x="0" y="5">100%</text>
    <text x="0" y="45">75%</text>
    <text x="0" y="85">50%</text>
    <text x="0" y="125">25%</text>
    <text x="0" y="165">0%</text>
  </g>

  <!-- Precipitation Bars -->
  <g transform="translate(60, 255)">
    <!-- Bar 1 (00:00) -->
    <rect x="25" y="-30" width="22" height="30" rx="4" fill="url(#barGradient)" class="bar-grow" />
    <!-- Bar 2 (03:00) -->
    <rect x="145" y="-70" width="22" height="70" rx="4" fill="url(#barGradient)" class="bar-grow" />
    <!-- Bar 3 (06:00) -->
    <rect x="265" y="-120" width="22" height="120" rx="4" fill="url(#barGradient)" class="bar-grow" />
    <!-- Bar 4 (09:00) -->
    <rect x="385" y="-85" width="22" height="85" rx="4" fill="url(#barGradient)" class="bar-grow" />
    <!-- Bar 5 (12:00) -->
    <rect x="505" y="-40" width="22" height="40" rx="4" fill="url(#barGradient)" class="bar-grow" />
    <!-- Bar 6 (15:00) -->
    <rect x="625" y="-15" width="22" height="15" rx="4" fill="url(#barGradient)" class="bar-grow" />
  </g>

  <!-- Temperature Filled Area & Stroke Curve -->
  <g transform="translate(60, 95)">
    <!-- Area Fill -->
    <path d="M 0 110 C 70 80, 100 65, 156 60 C 220 55, 250 85, 276 90 C 330 100, 370 40, 396 35 C 460 25, 490 50, 516 55 C 580 62, 610 80, 636 75 C 680 70, 700 45, 720 40 L 720 160 L 0 160 Z"
          fill="url(#areaGradient)" />

    <!-- Animated Path Line -->
    <path d="M 0 110 C 70 80, 100 65, 156 60 C 220 55, 250 85, 276 90 C 330 100, 370 40, 396 35 C 460 25, 490 50, 516 55 C 580 62, 610 80, 636 75 C 680 70, 700 45, 720 40"
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="chart-curve" />

    <!-- Anchor Points with Glow -->
    <circle cx="156" cy="60" r="5" fill="#38bdf8" filter="url(#pointGlow)" class="point-pulse" />
    <circle cx="276" cy="90" r="5" fill="#38bdf8" filter="url(#pointGlow)" />
    <circle cx="396" cy="35" r="5" fill="#38bdf8" filter="url(#pointGlow)" class="point-pulse" />
    <circle cx="516" cy="55" r="5" fill="#38bdf8" filter="url(#pointGlow)" />
    <circle cx="636" cy="75" r="5" fill="#38bdf8" filter="url(#pointGlow)" />
    <circle cx="720" cy="40" r="5" fill="#38bdf8" filter="url(#pointGlow)" class="point-pulse" />
  </g>

  <!-- X-Axis Labels (Timeline) -->
  <g transform="translate(60, 275)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
    <text x="36">00:00</text>
    <text x="156">03:00</text>
    <text x="276">06:00</text>
    <text x="396">09:00</text>
    <text x="516">12:00</text>
    <text x="636">15:00</text>
    <text x="720">18:00</text>
  </g>
</svg>
